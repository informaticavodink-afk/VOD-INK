name: Consent REST gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consent-artist-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start owned local Supabase stack
        run: npx supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Export local-only credentials
        shell: bash
        run: |
          npx supabase status --output env | while IFS= read -r line; do
            case "$line" in
              API_URL=*) echo "SUPABASE_URL=${line#API_URL=}" ;;
              DB_URL=*) echo "SUPABASE_DB_URL=${line#DB_URL=}" ;;
              ANON_KEY=*) echo "SUPABASE_ANON_KEY=${line#ANON_KEY=}" ;;
              SERVICE_ROLE_KEY=*) echo "SUPABASE_SERVICE_ROLE_KEY=${line#SERVICE_ROLE_KEY=}" ;;
            esac
          done >> "$GITHUB_ENV"
      - name: Run mandatory release tests
        run: npm test
      - name: Stop only this workflow's stack
        if: always()
        run: npx supabase stop --project-id Vod-INK --no-backup