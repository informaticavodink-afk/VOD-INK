name: Consent REST gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consent-artist-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - name: Start owned local Supabase stack
        run: bunx --no-install supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Export local-only credentials
        shell: bash
        run: |
          bunx --no-install supabase status --output env | while IFS= read -r line; do
            value=${line#*=}
            value="${value#\"}"
            value="${value%\"}"
            case "$line" in
              API_URL=*) echo "SUPABASE_URL=$value" ;;
              DB_URL=*) echo "SUPABASE_DB_URL=$value" ;;
              ANON_KEY=*) echo "SUPABASE_ANON_KEY=$value" ;;
              SERVICE_ROLE_KEY=*) echo "SUPABASE_SERVICE_ROLE_KEY=$value" ;;
            esac
          done >> "$GITHUB_ENV"
      - name: Run mandatory release tests
        run: bun run test
      - name: Stop only this workflow's stack
        if: always()
        run: bunx --no-install supabase stop --project-id Vod-INK --no-backup
