    <script>
      // Safe global polyfill patch to prevent read-only property write errors in the browser (e.g. window.fetch)
      if (typeof window !== 'undefined') {
        if (!window.global || window.global === window) {
          window.global = Object.create(window);
        }
        try {
          let originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return originalFetch;
            },
            set(val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Could not make window.fetch writable:', e);
        }
      }
    </script>
