project:
  name: Tus Consentimientos
  slug: vod-ink
  repository: https://github.com/informaticavodink-afk/VOD-INK.git
  description: |
    Aplicación cliente VOD-INK para gestionar consentimientos informados de un
    único estudio de tatuaje. El runtime actual es single-studio y no contiene
    modelos de organizaciones, membresías ni tenancy SaaS.

technology:
  frontend:
    - React 19
    - Vite 6
    - TypeScript 5.8
    - Tailwind CSS 4
    - React Router 7
    - React Hook Form + Zod
  backend:
    - Express 4 (local Node server)
    - Vercel server functions
    - Node.js 24.x
    - TypeScript 5.8 with tsx development runtime
  data:
    - Supabase Auth
    - Supabase PostgreSQL
    - Supabase Storage
    - Supabase Realtime
    - "@supabase/supabase-js 2.110"
    - "@supabase/ssr 0.12"
  testing:
    runner: Vitest 3.2
    environment: node
    unit: bun run test
    coverage: bun run test:coverage
    typecheck: bun run lint
    build: bun run build

architecture:
  tenancy: single-studio
  consent_pdf:
    generation: server-side
    trigger: authenticated artist finalization
    renderer: src/lib/pdf.ts
    orchestration: server/consents.ts
    persistence: >-
      Supabase Storage bucket consent-pdfs with PostgreSQL file metadata
    frontend_role: >-
      Collect consent data and signatures; never generate the final PDF

strict_tdd:
  enabled: true
  test_runner: bun run test
  evidence_required:
    RED: >-
      Capture a focused failing Vitest test before implementation.
    GREEN: >-
      Capture the focused test passing after the minimal implementation.
    TRIANGULATE: >-
      Add or exercise adjacent and edge cases to guard the behavior.
    REFACTOR: >-
      Re-run the focused suite after cleanup without changing behavior.
  verification_commands:
    - bun run test
    - bun run lint
    - bun run build

phases:
  default_mode: auto
  review_budget_lines: 300
  chained_pr_strategy: auto-forecast
  artifact_store: both
  rules:
    - >-
      Use the active change as the only current delivery target; retain
      historical change directories.

constraints:
  - >-
    The production runtime is single-studio and has no organization or
    membership models.
  - >-
    Historical SaaS and multitenant change artifacts are not descriptions of
    the current runtime.
  - Supabase Auth, PostgreSQL and Storage are the runtime sources of truth.
  - >-
    Final PDFs are generated only on the server during authenticated artist
    finalization.
  - >-
    RLS and server-side authorization are security boundaries, not only UI
    visibility controls.
  - Node.js runtime is pinned to 24.x.

existing_planning_docs:
  - docs/SDD_NEXT_STEPS.md
  - docs/plan-refresh-automatico-tablas.md

active_change:
  name: stabilize-consent-submission-and-signature
  description: >-
    Estabilizar el envío público de consentimientos con representante legal,
    exponer errores seguros y corregir la firma móvil sin ampliar el alcance.
  phases_completed:
    - explore
    - proposal
    - spec
    - design
    - tasks
  next_phase: apply
